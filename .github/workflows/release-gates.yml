name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://uliquid:uliquid@localhost:5432/uliquid
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      API_BASE_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            node_modules/.prisma
            node_modules/@prisma/engines
          key: prisma-${{ runner.os }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: API release hardening tests
        run: npm -w apps/api run test:release-hardening

      - name: Capital-moving type debt budget
        run: npm run quality:any-budget

      - name: Vendored charting checksum
        run: npm run quality:vendor-charting

      - name: Core package tests
        run: npm -w packages/core run test

      - name: Futures core tests
        run: npm -w packages/futures-core run test

      - name: Futures exchange tests
        run: npm -w packages/futures-exchange run test

  python-strategy-service:
    name: Python strategy service tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PY_STRATEGY_AUTH_TOKEN: test-token
      PY_GRID_AUTH_TOKEN: test-token
      PYTHONPATH: apps/py-strategy-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/py-strategy-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r apps/py-strategy-service/requirements.txt

      - name: Run tests
        run: pytest -q apps/py-strategy-service

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: npm run contracts:build

      - name: Test contracts
        run: npm run contracts:test
